<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로젝트 전시관</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #e9bd80;
            color: white;
            font-family: sans-serif;
        }

        /* 화면 하나 크기의 가로 스크롤 영역 */
        .gallery {
            width: 100%;
            height: 100vh;
            height: 100svh;
            overflow: hidden;
        }

        /* 벽지들을 가로로 연결 */
        .wall-track {
            display: flex;
            height: 100%;
        }

        /* 벽지 한 장 = 화면 하나 */
        .wall-page {
            flex: 0 0 100%;
            height: 100%;

            background-image: url("../assets/images/woodwall1.png");
            background-size: auto 100%;
            background-position: left center;
            background-repeat: repeat-x;

            position: relative;
        }

        /* 포스터 */
        .poster {

            position: absolute;

            width: 23%;
            max-width: 280px;

            /* 지정한 좌표에 포스터의 중심 맞추기 */
            transform: translate(-50%, -50%);
            aspect-ratio: 3 / 4;
            padding: clamp(10px, 2vw, 26px);

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            border: 8px solid #39251b;
            background: #f5ead5;
            color: #35281e;
            text-align: left;
            font: inherit;
            cursor: pointer;

            box-shadow: 5px 10px 18px rgba(0, 0, 0, 0.35);
            transition: transform 0.25s;
        }

        .poster h2 {
            margin: 16px 0;
            font-size: clamp(14px, 2.2vw, 30px);
            overflow-wrap: anywhere;
        }

        .poster p {
            font-size: clamp(11px, 1.2vw, 16px);
            line-height: 1.6;
        }

        .poster small {
            font-size: clamp(9px, 1vw, 13px);
        }

        /* 좌우 화살표 */
        .arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            z-index: 5;

            width: 34px;
            height: 54px;
            padding: 0;
            border: none;
            border-radius: 20px;

            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-size: 28px;
            cursor: pointer;
        }

        .arrow:hover {
            background: rgba(0, 0, 0, 0.55);
        }

        .arrow-left {
            left: 10px;
        }

        .arrow-right {
            right: 10px;
        }

        /* 현재 벽지 번호 */
        .page-number {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);

            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.3);
            font-size: 14px;
        }

        /* 프로젝트 확대 창 */
        .project-modal {
            width: min(850px, 92vw);
            max-height: 85vh;
            padding: 0;
            border: none;
            border-radius: 8px;
            background: #fff8ec;
            color: #35281e;
        }

        .project-modal::backdrop {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
        }

        .project-modal[open] {
            animation: enlarge 0.25s ease-out;
        }

        .modal-header {
            position: sticky;
            top: 0;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 20px 28px;

            background: #fff8ec;
            border-bottom: 1px solid #dccdb7;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close-button {
            border: none;
            background: transparent;
            color: inherit;
            font-size: 30px;
            cursor: pointer;
        }

        .modal-body {
            padding: 12px 28px 32px;
            line-height: 1.8;
        }

        .modal-body h3 {
            margin-top: 28px;
            padding-bottom: 8px;
            border-bottom: 1px solid #dccdb7;
        }

        .modal-body p {
            white-space: pre-line;
        }

        .architecture-image {
            width: 100%;
            height: auto;
        }

        @keyframes enlarge {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .project-modal[open] {
                animation: none;
            }

            .poster {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <main class="gallery">
        <div class="wall-track"></div>
    </main>

    <button class="arrow arrow-left"
            type="button" aria-label="이전 벽지">‹</button>

    <button class="arrow arrow-right"
            type="button" aria-label="다음 벽지">›</button>

    <div class="page-number" aria-live="polite"></div>

    <dialog class="project-modal" aria-labelledby="modal-title">
        <header class="modal-header">
            <h2 id="modal-title"></h2>
            <button class="close-button"
                    type="button" aria-label="닫기">×</button>
        </header>

        <div class="modal-body">
            <h3>프로젝트 개요</h3>
            <p id="modal-overview"></p>

            <h3>담당 역할</h3>
            <p id="modal-role"></p>

            <h3>아키텍처</h3>
            <p id="modal-architecture"></p>
            <img class="architecture-image"
                 id="modal-image"
                 alt="프로젝트 아키텍처"
                 hidden>

            <h3>사용 기술</h3>
            <p id="modal-tech"></p>

            <h3>문제 해결 및 배운 점</h3>
            <p id="modal-learning"></p>
        </div>
    </dialog>

    <script>
        /*
         * 이 목록에 프로젝트를 추가하거나 삭제하면
         * 포스터 수와 벽지 장수가 자동으로 바뀜.
         */
        const projects = [
            {
                title: "로보어드바이저",
                x: 20,
                y: 50,
                summary: "투자 성향에 맞는 포트폴리오 추천",
                overview: "프로젝트 개요를 작성해 주세요.",
                role: "담당 역할을 작성해 주세요.",
                architecture: "시스템 구성과 데이터 흐름을 작성해 주세요.",
                image: "",
                tech: "사용 기술을 작성해 주세요.",
                learning: "문제 해결 경험을 작성해 주세요."
            },
            {
                title: "DevOps",
                x: 50,
                y: 55,
                summary: "배포 자동화와 모니터링",
                overview: "",
                role: "",
                architecture: "",
                image: "",
                tech: "",
                learning: ""
            },
            {
                title: "데이터베이스",
                x: 80,
                y: 60,
                summary: "데이터베이스 설계 프로젝트",
                overview: "",
                role: "",
                architecture: "",
                image: "",
                tech: "",
                learning: ""
            },
            {
                title: "프로젝트 4",
                x: 20,
                y: 50,
                summary: "프로젝트 소개",
                overview: "",
                role: "",
                architecture: "",
                image: "",
                tech: "",
                learning: ""
            },
            {
                title: "프로젝트 5",
                x: 50,
                y: 55,
                summary: "프로젝트 소개",
                overview: "",
                role: "",
                architecture: "",
                image: "",
                tech: "",
                learning: ""
            }
        ];

        const postersPerPage = 3;

        const gallery = document.querySelector(".gallery");
        const track = document.querySelector(".wall-track");
        const pageNumber = document.querySelector(".page-number");
        const modal = document.querySelector(".project-modal");
        const modalImage = document.querySelector("#modal-image");

        const totalPages = Math.ceil(projects.length / postersPerPage);
        let currentPage = 0;

        /* 프로젝트 수에 맞춰 벽지와 포스터 생성 */
        for (let page = 0; page < totalPages; page++) {
            const wallPage = document.createElement("section");
            wallPage.className = "wall-page";
            wallPage.setAttribute("aria-label", "벽지 " + (page + 1));

            const start = page * postersPerPage;
            const end = Math.min(start + postersPerPage, projects.length);

            for (let i = start; i < end; i++) {
                const project = projects[i];

                const poster = document.createElement("button");
                poster.type = "button";
                poster.className = "poster";
                // 좌표를 생략하면 기존처럼 3개를 일정한 간격으로 배치
                const defaultX = [20, 50, 80];

                poster.style.left =
                    (project.x ?? defaultX[i % postersPerPage]) + "%";

                poster.style.top =
                    (project.y ?? 50) + "%";

                const number = document.createElement("small");
                number.textContent =
                    "PROJECT " + String(i + 1).padStart(2, "0");

                const description = document.createElement("div");

                const title = document.createElement("h2");
                title.textContent = project.title;

                const summary = document.createElement("p");
                summary.textContent = project.summary;

                const hint = document.createElement("small");
                hint.textContent = "자세히 보기 ↗";

                description.append(title, summary);
                poster.append(number, description, hint);

                poster.addEventListener("click", function () {
                    openProject(project);
                });

                wallPage.appendChild(poster);
            }

            track.appendChild(wallPage);
        }

        function updatePageNumber() {
            pageNumber.textContent = totalPages
                ? (currentPage + 1) + " / " + totalPages
                : "프로젝트가 없습니다";
        }

        /* 벽지 단위로 이동하고, 마지막에서는 처음으로 */
        function movePage(direction) {
            if (totalPages === 0) return;

            currentPage =
                (currentPage + direction + totalPages) % totalPages;

            const reduceMotion = window.matchMedia(
                "(prefers-reduced-motion: reduce)"
            ).matches;

            gallery.scrollTo({
                left: currentPage * gallery.clientWidth,
                behavior: reduceMotion ? "instant" : "smooth"
            });

            updatePageNumber();
        }

        document.querySelector(".arrow-left")
            .addEventListener("click", function () {
                movePage(-1);
            });

        document.querySelector(".arrow-right")
            .addEventListener("click", function () {
                movePage(1);
            });

        /* 창 크기가 바뀌어도 현재 벽지에 맞추기 */
        window.addEventListener("resize", function () {
            gallery.scrollTo({
                left: currentPage * gallery.clientWidth,
                behavior: "instant"
            });
        });

        /* 프로젝트 상세 창 */
        function openProject(project) {
            document.querySelector("#modal-title").textContent =
                project.title;

            const fields = [
                "overview", "role", "architecture", "tech", "learning"
            ];

            fields.forEach(function (field) {
                document.querySelector("#modal-" + field).textContent =
                    project[field] || "내용을 준비 중입니다.";
            });

            modalImage.hidden = !project.image;

            if (project.image) {
                modalImage.src = project.image;
            } else {
                modalImage.removeAttribute("src");
            }

            modal.showModal();
            modal.scrollTop = 0;
        }

        document.querySelector(".close-button")
            .addEventListener("click", function () {
                modal.close();
            });

        modal.addEventListener("click", function (event) {
            const rect = modal.getBoundingClientRect();

            if (
                event.clientX < rect.left ||
                event.clientX > rect.right ||
                event.clientY < rect.top ||
                event.clientY > rect.bottom
            ) {
                modal.close();
            }
        });

        updatePageNumber();
    </script>
</body>
</html>
